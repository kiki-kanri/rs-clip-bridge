[package]
name = "rs-clip-bridge-client"
version = "0.2.1"
edition.workspace = true

description = "Cross-platform clipboard sync client for rs-clip-bridge. Monitors local clipboard changes and synchronizes them with a remote server via WebSockets. All clipboard data is encrypted using ChaCha20-Poly1305."
# documentation = "https://docs.rs/crate-name"
# homepage.workspace = true
license.workspace = true
readme = "./README.md"
repository.workspace = true

categories.workspace = true
keywords.workspace = true

include = [
  "Cargo.toml",
  "LICENSE*",
  "README.md",
  "benches/**",
  "examples/**",
  "src/**",
  "tests/**",
]

# Prevent accidental publishing for private/internal crates.
# publish = false

# Only needed when using native linking / sys crates.
# links = "native-library-name"

# Cargo auto-detects build.rs by default.
# Use `build = false` to disable auto-detection, or a custom path if needed.
# build = "build.rs"

# Optional cargo/tool metadata.
# [package.metadata]


# =============================================================================
# Lints
# =============================================================================

[lints]
workspace = true

# =============================================================================
# Features
# =============================================================================

[features]
default = ["rustls-ring"]

# Convenience aliases.
all = ["rustls-ring"]
full = ["all"]

# Example:
# serde = ["dep:serde"]
# cli = ["dep:clap"]
# async = ["dep:tokio"]

# Define features here.
rustls-aws-lc-rs = [
  "rustls/aws-lc-rs",
  "wsio-client/tls-rustls-webpki",
]

rustls-ring = [
  "rustls/ring",
  "wsio-client/tls-rustls-webpki",
]

# =============================================================================
# Dependencies
# =============================================================================

[dependencies]
anyhow = "1.0.103"
arboard = "3.6.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.2", features = ["derive", "env"] }
clipboard-master = "4.0.0"
confique = { version = "0.4.0", features = ["toml"] }
hex = "0.4.3"
kikiutils = { version = "0.11.2", features = ["logger", "signal", "task"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"], default-features = false }
rand = "0.10.2"
rustls = { version = "0.23.42", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.4", features = ["rt-multi-thread"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
wsio-client = { version = "0.8.11", features = ["packet-codec-postcard"] }
zstd = { version = "0.13.3", features = ["zstdmt"] }

# -----------------------------------------------------------------------------
# OS / family-specific dependencies
# -----------------------------------------------------------------------------

# Applies to Linux, macOS, BSD, Android, iOS, etc.
[target.'cfg(unix)'.dependencies]


[target.'cfg(windows)'.dependencies]


# Linux-only deps.
[target.'cfg(target_os = "linux")'.dependencies]


# macOS-only deps.
[target.'cfg(target_os = "macos")'.dependencies]


# Windows-only deps. Usually same as cfg(windows), but kept explicit for template clarity.
[target.'cfg(target_os = "windows")'.dependencies]


[target.'cfg(target_family = "wasm")'.dependencies]


[target.'cfg(target_arch = "wasm32")'.dependencies]

# -----------------------------------------------------------------------------
# Target cfg / ABI-specific dependencies
# -----------------------------------------------------------------------------

# Linux GNU / glibc only.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]


# Linux musl only.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]


# Windows MSVC only.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]


# Windows GNU only.
[target.'cfg(all(target_os = "windows", target_env = "gnu"))'.dependencies]


# macOS Intel only.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]


# macOS Apple Silicon only.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]


# Custom sections for exact target triples or custom target cfgs.
