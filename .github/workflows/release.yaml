name: Release

on:
  push:
    tags:
      - rs-clip-bridge-client-v*
      - rs-clip-bridge-server-v*
  workflow_dispatch: null

permissions:
  contents: read

# Every run republishes the same rolling release, so only the newest one matters.
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - os: windows-2025-vs2026
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Release builds must not fail on warnings; tag-scoped caches are never restored by later tags.
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ''
          cache: false
          target: ${{ matrix.target }}

      - name: Install musl-tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Set up Zig
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install cargo-zigbuild
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          case "${TARGET}" in
            *windows*)
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File "scripts/build/release/internal/${TARGET}.ps1" --workspace
              ;;
            *)
              "./scripts/build/release/${TARGET}.sh" --workspace
              ;;
          esac

      - name: Collect binaries
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          ext=''
          [[ "${TARGET}" == *windows* ]] && ext='.exe'

          mkdir -p ./output
          for bin in rs-clip-bridge-client rs-clip-bridge-server; do
            cp "target/${TARGET}/release/${bin}${ext}" "./output/${bin}-${TARGET}${ext}"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: binaries-${{ matrix.target }}
          path: ./output/*
          retention-days: 3

  publish:
    name: Publish latest release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./binaries

      - name: Verify binaries
        run: |
          actual_count="$(find ./binaries -type f | wc -l)"
          expected_count=14

          if [[ "${actual_count}" -ne "${expected_count}" ]]; then
            echo "expected ${expected_count} binaries, found ${actual_count}" >&2
            find ./binaries -type f -print >&2
            exit 1
          fi

      # Recreating the release moves the latest tag to this commit and drops stale assets.
      - name: Publish latest release
        env:
          BUILD_TIME: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi

          notes="$(cat <<NOTES
          ## Automated Build Artifacts (Latest)
          This release contains the latest binaries automatically generated by GitHub Actions.

          - **Source Tag/Branch**: \`${REF_NAME}\`
          - **Build Time**: \`${BUILD_TIME}\`
          - **Commit SHA**: \`${GITHUB_SHA}\`

          *Note: These are rolling builds and may contain experimental features.*
          NOTES
          )"

          gh release create latest ./binaries/* \
            --notes "${notes}" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title 'Latest Release Build'
